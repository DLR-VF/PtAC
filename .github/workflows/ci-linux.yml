name: Test PtAC with Mamba on Linux

on:
  push:
    branches: [ master, dev, work ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            environment-file: .github/build_environments/environment-linux.yml

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # get full history for version tags etc.

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: false
          activate-environment: ptac-dev
          python-version: ${{ matrix.python-version }}
          environment-file: ${{ matrix.environment-file }}
          channels: conda-forge 
          conda-remove-defaults: true
          auto-update-conda: true

      - name: Verify Conda setup
        run: |
          conda info
          conda list

      - name: Install PtAC
        run: |
          python -m pip install --upgrade pip
          python setup.py install

      - name: Lint code
        run: |
          isort .  --check-only
          black . --check
          flake8 .
          pydocstyle . --ignore=D104,D100,D103,D212

      - name: Run tests
        run: |
          pytest -v
